<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Student</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
</head>
<body class="container py-4">
<h1 class="h3 mb-3">Add New Student</h1>
<form th:action="@{/students}" th:object="${studentForm}" method="post" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">First Name</label>
        <input type="text" th:field="*{firstName}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
    </div>
    <div class="col-md-6">
        <label class="form-label">Last Name</label>
        <input type="text" th:field="*{lastName}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
    </div>
    <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" th:field="*{email}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input type="text" th:field="*{phone}" class="form-control"/>
    </div>
    <div class="col-md-6">
        <label class="form-label">Birth Year</label>
        <input type="number" th:field="*{birthYear}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('birthYear')}" th:errors="*{birthYear}"></div>
    </div>
    <div class="col-md-6 form-check mt-4">
        <input type="checkbox" th:field="*{active}" class="form-check-input" id="activeCheck"/>
        <label for="activeCheck" class="form-check-label">Active</label>
    </div>
    <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Create</button>
        <a th:href="@{/students}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
