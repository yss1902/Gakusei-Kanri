<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Detail</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
</head>
<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3">Student Detail</h1>
    <div class="d-flex gap-2">
        <a th:href="@{'/students/' + ${student.id} + '/edit'}" class="btn btn-primary">Edit</a>
        <a th:href="@{/students}" class="btn btn-secondary">Back to List</a>
    </div>
</div>
<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
<div class="card">
    <div class="card-body">
        <p><strong>ID:</strong> <span th:text="${student.id}"></span></p>
        <p><strong>Name:</strong> <span th:text="${student.fullName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
        <p><strong>Phone:</strong> <span th:text="${student.maskedPhone}"></span></p>
        <p><strong>Birth Year:</strong> <span th:text="${student.birthYear}"></span></p>
        <p><strong>Status:</strong> <span th:text="${student.status}"></span></p>
    </div>
</div>
<form th:action="@{'/students/' + ${student.id} + '/delete'}" method="post" class="mt-3">
    <button type="submit" class="btn btn-danger" onclick="return confirm('Delete this student?');">Delete</button>
</form>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
